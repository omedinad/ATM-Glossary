name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # Enable the optional saved-Wikipedia-HTML extractor tests as well as core tests.
      - run: python3 -m pip install -r tools/requirements-import.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/check_public.py
      - run: ./gradlew :app:testPublicDebugUnitTest :app:lintPublicDebug :app:assemblePublicDebug --console=plain
